name: CI

# A static site deployed by Cloudflare Pages, so there is no build to fail;
# these checks catch the mistakes that would otherwise only show up live.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Every local link, image, audio and video resolves
        run: python3 tools/check-links.py

      - name: No inline scripts or handlers; CSP present
        run: python3 tools/check-site.py

      - name: Pages Functions and scripts parse
        run: for f in functions/api/*.js i18n.js assets/js/*.js admin/admin.js; do node --check "$f"; done

      - name: Translation dictionaries are valid JSON
        run: for f in i18n/*.json; do python3 -m json.tool "$f" > /dev/null; done
